// The release (docs/release.md): the pack a player imports into Prism, the mods and the LWJGL component on their own
// for existing instances, and the server package, each with the notices and sources its contents' licences ask for.
// `./gw release` writes everything for one version into local/release/<version>/, with SHA256SUMS.txt. Nothing here
// publishes anything.

import groovy.json.JsonOutput
import java.security.MessageDigest

def releaseVersion = oldfaithful_version
def releaseTag = "v${releaseVersion}"
def downloadBase = "https://github.com/${release_repo}/releases/download/${releaseTag}/"
def componentVersion = "${releaseVersion}+lwjgl.${lwjgl3_version}"
def staging = layout.buildDirectory.dir('release')

configurations {
    // The component's Windows natives (the first release is Windows only; docs/release.md).
    releaseNatives { transitive = false }
    // Source the licences of what we ship ask for (OpenAL Soft's LGPL, tiny-remapper's LGPL inside the loader, SAT4J).
    releaseSources { transitive = false }
    // The same, for modules published with Gradle metadata, whose sources are a variant rather than a classifier.
    releaseSourceVariants {
        transitive = false
        attributes {
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.DOCUMENTATION))
            attribute(DocsType.DOCS_TYPE_ATTRIBUTE, objects.named(DocsType, DocsType.SOURCES))
        }
    }
}
dependencies {
    releaseNatives "org.studioquire.oldfaithful.natives:lwjgl3:${lwjgl3_natives_version}:natives-windows"
    releaseNatives "org.studioquire.oldfaithful.natives:sdl3:${sdl3_version}:natives-windows"
    releaseNatives "org.studioquire.oldfaithful.natives:openal-soft:${openal_version}:natives-windows-lwjgl3"
    releaseSources "org.studioquire.oldfaithful.natives:openal-soft:${openal_version}:sources@zip"
    releaseSources "net.fabricmc:fabric-loader:${fabric_loader_version}:sources@jar"
    releaseSourceVariants "net.fabricmc:tiny-remapper:${loader_tiny_remapper_version}"
    releaseSources "org.ow2.sat4j:org.ow2.sat4j.core:${loader_sat4j_version}:sources@jar"
    releaseSources "org.ow2.sat4j:org.ow2.sat4j.pb:${loader_sat4j_version}:sources@jar"
}

def releaseTokens = ([
    VERSION              : releaseVersion,
    NAME                 : release_name,
    TAGLINE              : release_tagline,
    REPO                 : release_repo,
    HOMEPAGE             : release_homepage,
    FABRIC_LOADER_VERSION: fabric_loader_version,
    LWJGL_VERSION        : componentVersion,
    OLDFAITHFUL_VERSION  : releaseVersion,
    LWJGL3_NATIVES_VERSION: lwjgl3_natives_version,
    SDL3_VERSION         : sdl3_version,
    OPENAL_VERSION       : openal_version,
    TINY_REMAPPER        : loader_tiny_remapper_version,
    SAT4J                : loader_sat4j_version,
    INTERMEDIARY         : intermediary,
    MINECRAFT_CLIENT_URL : minecraft_client_url,
    MINECRAFT_CLIENT_SHA1: minecraft_client_sha1,
    MINECRAFT_CLIENT_SIZE: minecraft_client_size,
    LOADER_LIBRARIES     : (["net.fabricmc:fabric-loader:${fabric_loader_version}", "net.fabricmc:sponge-mixin:${mixin_version}"] +
            ['asm', 'asm-analysis', 'asm-commons', 'asm-tree', 'asm-util'].collect { "org.ow2.asm:${it}:${asm_version}" })
            .collect { "        {\"name\": \"${it}\", \"MMC-hint\": \"local\"}" }.join(',\n'),
]).collectEntries { k, v -> [k, v.toString()] }
def filterTokens = { String line ->
    line.replaceAll(/@([A-Z0-9_]+)@/) { all, name ->
        if (!releaseTokens.containsKey(name)) throw new GradleException("unknown token @${name}@")
        releaseTokens[name]
    }
}
def crlf = { spec -> spec.filter(org.apache.tools.ant.filters.FixCrLfFilter, eol: org.apache.tools.ant.filters.FixCrLfFilter.CrLf.newInstance('crlf')) }

def modProjects = ['oldfaithful-hardening', 'oldfaithful-saves', 'oldfaithful-speed', 'oldfaithful-display']
def serverMods = ['oldfaithful-hardening', 'oldfaithful-saves']
// Looked up when a task is configured: the subprojects are evaluated after this script.
def componentJar = { project(':oldfaithful-lwjgl').tasks.named('bakeLwjgl').flatMap { it.output } }
def jarOf = { Configuration conf, String module -> conf.filter { it.name.startsWith(module + '-') } }

// THIRD-PARTY-NOTICES.txt for the pack and for the server package, from the parts in release/notices.
def notices = tasks.register('releaseNotices') {
    description = 'Assembles the notices files of the pack and the server package from release/notices.'
    def parts = layout.projectDirectory.dir('release/notices')
    def out = staging.map { it.dir('notices') }
    inputs.dir(parts)
    inputs.property('tokens', releaseTokens.findAll { it.key != 'LOADER_LIBRARIES' })
    outputs.dir(out)
    doLast {
        def dir = parts.asFile
        def write = { String name, List<String> files ->
            def text = files.collect { new File(dir, it).getText('UTF-8').trim() }.join('\n\n') + '\n'
            def target = out.get().file("${name}/THIRD-PARTY-NOTICES.txt").asFile
            target.parentFile.mkdirs()
            target.setText(text.readLines().collect(filterTokens).join('\r\n') + '\r\n', 'UTF-8')
        }
        def common = ['10-fabric-loader.txt', '11-mixin.txt', '12-asm.txt', '13-intermediary.txt']
        write('notices-pack', ['00-header-pack.txt'] + common + ['20-lwjgl-component.txt', '21-natives.txt'])
        write('notices-server', ['00-header-server.txt'] + common)
    }
}

// licenses/ (our licence, the texts the notices point to, each shipped jar's own licence files) and
// THIRD-PARTY-NOTICES.txt. Paths are rewritten by replacing a segment, so the specs also work inside a folder.
ext.licencesSpec = { boolean pack ->
    copySpec {
        includeEmptyDirs = false
        into('licenses') {
            from('LICENSE') { into 'pure-faithful'; rename { 'LICENSE.txt' } }
            from('release/licenses') { into 'common' }
            from({ zipTree(jarOf(configurations.loaderLibraries, 'fabric-loader').singleFile) }) {
                include 'LICENSE_fabric-loader', 'net/fabricmc/loader/impl/lib/sat4j/about-sat4j.html'
                into 'fabric-loader'
                eachFile { it.path = it.path.replace('net/fabricmc/loader/impl/lib/sat4j/', '') }
            }
            from({ zipTree(jarOf(configurations.loaderLibraries, 'sponge-mixin').singleFile) }) {
                include 'LICENSE.txt'
                into 'sponge-mixin'
            }
            if (pack) {
                from({ zipTree(componentJar().get().asFile) }) {
                    include 'META-INF/licenses/**'
                    into 'purefaithful-lwjgl'
                    eachFile { it.path = it.path.replace('META-INF/licenses/', '') }
                }
                [lwjgl3: 'lwjgl3-natives', sdl3: 'sdl3', 'openal-soft': 'openal-soft'].each { module, folder ->
                    from({ zipTree(jarOf(configurations.releaseNatives, module).singleFile) }) {
                        include 'META-INF/licenses/**'
                        into folder
                        eachFile { it.path = it.path.replace('META-INF/licenses/', '') }
                    }
                }
            }
        }
        def kind = pack ? 'notices-pack' : 'notices-server'
        from(notices) {
            include "${kind}/**"
            eachFile { it.path = it.path.replace("${kind}/", '') }
        }
    }
}

// sources/: what the LGPL and EPL parts ask for, with a README saying what each is.
ext.sourcesSpec = { boolean pack ->
    copySpec {
        into('sources') {
            from(configurations.releaseSources.filter { pack || !it.name.startsWith('openal-soft') })
            from(configurations.releaseSourceVariants)
            if (pack) from('natives/build.py') { rename { 'build-natives.py' } }
            from(pack ? 'release/sources-README-pack.txt' : 'release/sources-README-server.txt') {
                rename { 'README.txt' }
                filter filterTokens
                crlf(delegate)
            }
        }
    }
}

// The pack: the Prism instance a player imports. Everything but Minecraft (Mojang's, fetched by Prism) is inside,
// with Prism's "local" hint, so nothing else is downloaded and nothing depends on our hosting.
def pack = tasks.register('releasePack', Zip) {
    group = 'oldfaithful'
    description = 'Builds the Purist pack: the Prism instance players import (local/release/<version>/).'
    inputs.property('tokens', releaseTokens)
    from('prism/release') {
        // Only the template: other work (icon candidates) may sit beside it.
        include 'instance.cfg', 'mmc-pack.json', 'patches/*.json'
        filesMatching(['mmc-pack.json', 'patches/*.json', 'instance.cfg']) { filter filterTokens }
    }
    // The icon (the β seal, drawn by tools/icon_candidates.py), named for instance.cfg's iconKey.
    from('prism/release/icons/final/purefaithful-128.png') { rename { 'purefaithful.png' } }
    from('prism/dev/patches') {
        include 'net.fabricmc.fabric-loader.json', 'net.fabricmc.intermediary.json'
        into 'patches'
        filter filterTokens
    }
    from('release/pack-README.txt') { rename { 'README.txt' }; filter filterTokens; crlf(delegate) }
    from(oldfaithfulMinecraft.intermediaryMappings) { into 'libraries' }
    from(configurations.loaderLibraries) { into 'libraries' }
    from(configurations.releaseNatives) { into 'libraries' }
    from(componentJar()) { into 'libraries' }
    modProjects.each { m -> from(project(":${m}").tasks.named('remapJar')) { into '.minecraft/mods' } }
    with licencesSpec(true)
    with sourcesSpec(true)
    includeEmptyDirs = false
    destinationDirectory = staging.map { it.dir('out') }
    archiveFileName = "${release_file_name}-${releaseVersion}.zip"
}

// For existing instances: org.lwjgl.json, the component with each library's download URL (this release's assets on
// GitHub), SHA-1 and size, which Prism checks; the libraries themselves under asset names without '+', which GitHub
// would rewrite.
def component = tasks.register('releaseComponent') {
    group = 'oldfaithful'
    description = 'Writes the standalone LWJGL component file and its library assets.'
    def out = staging.map { it.dir('component') }
    def natives = configurations.releaseNatives
    inputs.files(natives)
    inputs.file(componentJar())
    inputs.property('downloadBase', downloadBase)
    outputs.dir(out)
    doLast {
        def dir = out.get().asFile
        project.delete(dir)
        dir.mkdirs()
        def sha1 = { File f -> MessageDigest.getInstance('SHA-1').digest(f.bytes).encodeHex().toString() }
        def asset = { File f, String assetName ->
            def target = new File(dir, assetName)
            target.bytes = f.bytes
            [url: downloadBase + assetName, sha1: sha1(f), size: f.length()]
        }
        def libraries = [[name: "org.studioquire.purefaithful:purefaithful-lwjgl:${releaseVersion}",
                          downloads: [artifact: asset(componentJar().get().asFile, "purefaithful-lwjgl-${releaseVersion}.jar")]]]
        [[module: 'lwjgl3', version: lwjgl3_natives_version, classifier: 'natives-windows'],
         [module: 'sdl3', version: sdl3_version, classifier: 'natives-windows'],
         [module: 'openal-soft', version: openal_version, classifier: 'natives-windows-lwjgl3']].each { n ->
            File f = natives.files.find { it.name == "${n.module}-${n.version}-${n.classifier}.jar" }
            if (f == null) throw new GradleException("no ${n.module} natives in releaseNatives")
            // Our build revision (+oldfaithful.N, the project's internal name) stays in the Maven version only.
            def assetName = "${release_file_name.toLowerCase()}-${n.module}-${n.version.replaceFirst(/\+.*/, '')}-${n.classifier}.jar"
            libraries << [name: "org.studioquire.oldfaithful.natives:${n.module}:${n.version}",
                          downloads: [classifiers: [(n.classifier): asset(f, assetName)]],
                          natives: [windows: n.classifier], extract: [exclude: ['META-INF/']]]
        }
        def json = [formatVersion: 1, name: "LWJGL (${release_name}: the LWJGL 2 API on LWJGL 3 and SDL3)", uid: 'org.lwjgl',
                    version: componentVersion, type: 'release', order: -1, conflicts: [[uid: 'org.lwjgl3']],
                    libraries: libraries]
        new File(dir, 'org.lwjgl.json').setText(JsonOutput.prettyPrint(JsonOutput.toJson(json)) + '\n', 'UTF-8')
    }
}

def serverZip = tasks.register('releaseServer', Zip) {
    group = 'oldfaithful'
    description = 'Zips the server package for the release.'
    inputs.property('serverSha1', minecraft_server_sha1)
    into("${release_file_name}-server") { serverPackageContents(it) }
    includeEmptyDirs = false
    destinationDirectory = staging.map { it.dir('out') }
    archiveFileName = "${release_file_name}-server-${releaseVersion}.zip"
}

def sourcesZip = tasks.register('releaseSourcesZip', Zip) {
    description = 'The third-party sources on their own, for the release page beside the standalone component.'
    with sourcesSpec(true)
    destinationDirectory = staging.map { it.dir('out') }
    archiveFileName = "${release_file_name}-${releaseVersion}-third-party-sources.zip"
}

tasks.register('release', Sync) {
    group = 'oldfaithful'
    description = 'Builds everything for a release into local/release/<version>/, with SHA256SUMS.txt. Publishes nothing.'
    from(pack)
    from(serverZip)
    from(sourcesZip)
    from(component)
    modProjects.each { m -> from(project(":${m}").tasks.named('remapJar')) }
    into layout.projectDirectory.dir("local/release/${releaseVersion}")
    preserve { include 'SHA256SUMS.txt' }
    doLast {
        def dir = destinationDir
        def lines = dir.listFiles().findAll { it.isFile() && it.name != 'SHA256SUMS.txt' }.sort { it.name }.collect {
            "${MessageDigest.getInstance('SHA-256').digest(it.bytes).encodeHex()}  ${it.name}"
        }
        new File(dir, 'SHA256SUMS.txt').setText(lines.join('\n') + '\n', 'UTF-8')
        logger.lifecycle("Release ${releaseVersion}: ${dir}")
        lines.each { logger.lifecycle("  ${it}") }
    }
}
